name: Force Upgrade HugoBlox

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'HugoBlox version to upgrade to (default: canary)'
        default: 'canary'

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Upgrade HugoBlox
        run: |
          hugo mod get -u github.com/HugoBlox/kit@${{ github.event.inputs.version }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Upgrade HugoBlox to ${{ github.event.inputs.version }}"
          git push
