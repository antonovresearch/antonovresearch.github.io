bio: Prof. Pozharskii was not only my PhD supervisor, but he was a beacon in the scientific world for me. He taught me how to properly plan an experiment, how to write research papers, how to supervise students, how to make grant applications, and how to give lectures. I am who I am today thanks to Prof. Pozharskii and his contribution to me.
